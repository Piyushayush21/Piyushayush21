name: Update stats card

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Generate stats-card.svg
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: Piyushayush21
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-card.svg
          git diff --quiet --cached || git commit -m "chore: refresh stats card"
          git push
